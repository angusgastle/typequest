  <line x1="78" y1="50" x2="78" y2="100" stroke="white" stroke-width="1" opacity="0.7"/>
  <!-- Crossguard -->
  <rect x="70" y="105" width="20" height="6" fill="#8b4513" stroke="black" stroke-width="1" rx="1"/>
  <!-- Handle -->
  <rect x="75" y="111" width="10" height="35" fill="#d2691e" stroke="black" stroke-width="1" rx="2"/>
  <!-- Handle wrap -->
  <line x1="75" y1="120" x2="85" y2="120" stroke="gold" stroke-width="1"/>
  <line x1="75" y1="130" x2="85" y2="130" stroke="gold" stroke-width="1"/>
  <!-- Pommel -->
  <circle cx="80" cy="150" r="4" fill="#8b4513" stroke="black" stroke-width="1"/>
</svg>