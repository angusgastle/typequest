<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Staff pole (held vertically in the right hand) -->
  <rect x="110" y="18" width="10" height="122" fill="#8b4513" stroke="black" stroke-width="1" rx="5"/>
  <!-- Orb at top -->
  <circle cx="115" cy="18" r="10" fill="#9370db" stroke="black" stroke-width="1"/>
  <!-- Magic sparkles on orb -->
  <text x="115" y="23" font-size="10" fill="#ff69b4" text-anchor="middle">✨</text>
  <!-- Runes on staff -->
  <text x="105" y="80" font-size="8" fill="gold">∆</text>
  <text x="115" y="80" font-size="8" fill="gold">◆</text>
  <!-- Rings/bands -->
  <ellipse cx="115" cy="55" rx="7" ry="3" fill="none" stroke="gold" stroke-width="1"/>
  <ellipse cx="115" cy="105" rx="7" ry="3" fill="none" stroke="gold" stroke-width="1"/>
</svg>
