<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Staff pole -->
  <rect x="75" y="30" width="10" height="120" fill="#8b4513" stroke="black" stroke-width="1" rx="5"/>
  <!-- Orb at top -->
  <circle cx="80" cy="30" r="10" fill="#9370db" stroke="black" stroke-width="1"/>
  <!-- Magic sparkles on orb -->
  <text x="80" y="35" font-size="10" fill="#ff69b4" text-anchor="middle">✨</text>
  <!-- Runes on staff -->
  <text x="75" y="80" font-size="8" fill="gold">∆</text>
  <text x="85" y="80" font-size="8" fill="gold">◆</text>
  <!-- Rings/bands -->
  <ellipse cx="80" cy="65" rx="7" ry="3" fill="none" stroke="gold" stroke-width="1"/>
  <ellipse cx="80" cy="100" rx="7" ry="3" fill="none" stroke="gold" stroke-width="1"/>
</svg>